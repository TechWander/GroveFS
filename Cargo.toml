[package]
name = "grovefs"
version = "0.1.0"
edition = "2021"
description = "A user-view FUSE filesystem with pluggable storage backend, no NFS"
license = "MIT"

# The `[[bin]]` is the Linux FUSE mount + cluster server. The native clients
# (see the sibling `grovefs-client` repo: `win/` WinFsp, `mac/` macOS skeleton)
# depend on the `lib` only, with the
# `remote-only` feature, so it never pulls `fuser`/`libc` and builds without a
# FUSE or POSIX-libc dependency. The binary needs the full native stack.
[[bin]]
name = "grovefs"
path = "src/main.rs"
required-features = ["native"]

[lib]
name = "grovefs"
path = "src/lib.rs"

[features]
# Full build: fuse-bridge + on-disk metadata engine (rusqlite) + PostgreSQL
# backend + the cluster servers/control plane. On by default for the Linux
# `grovefs` binary.
default = ["native"]
# The kernel FUSE bridge and real POSIX shims only: `fuser` (kernel bridge),
# `libc` (real errno/ids/signals), plus the `fs_impl` mount path and `bwlimit`
# shaper they need. NO on-disk engine and NO server/control plane. This is what
# a platform-native client links when it serves a REMOTE view through the same
# `GroveFS` code as `grovefs mount` — e.g. the macOS client, combining this with
# `remote-only`: `--no-default-features --features remote-only,fuse-bridge`.
fuse-bridge = ["dep:fuser", "dep:libc"]
# Server-side/on-disk stack: everything in fuse-bridge plus the metadata engines
# and the control plane. Disabled for client builds.
native = ["fuse-bridge", "dep:rusqlite", "dep:postgres"]
# Client transport only: remote MetaProvider + StorageBackend + wire protocol,
# no fuser/libc, no engine. Combine with `--no-default-features` (the Windows
# WinFsp client's build).
remote-only = []

[dependencies]
# FUSE in userspace. 0.18: high-level Filesystem trait is &self + Send/Sync and
# the session dispatches concurrently across worker threads (Config::n_threads
# with per-worker cloned /dev/fuse fds via FUSE_DEV_IOC_CLONE, Linux). The old
# abi-7-* feature flags are gone; capabilities are negotiated at runtime in
# `init` (KernelConfig::add_capabilities with InitFlags). OPTIONAL: only the
# `fuse-bridge` mount path needs it, so a purely remote client (WinFsp) drops it.
fuser = { version = "0.18", optional = true }
# Embedded metadata engine: view tree + inode mapping. bundled = compile SQLite from source, no system dep. OPTIONAL: only the on-disk `native` engine (src/meta/engine.rs + the meta-server) links it; the `remote-only` client build drops it — and with it the bundled-SQLite C compilation.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# libc for pread/pwrite/fsync (true positional IO, no seek races) and POSIX
# ids/signals. OPTIONAL: the client-only build uses `src/platform.rs` shims
# instead, so this is only pulled in under `fuse-bridge` (or `native`).
libc = { version = "0.2", optional = true }
# CLI
clap = { version = "4", features = ["derive"] }
# Fast in-process locks for the attribute/handle caches
parking_lot = "0.12"
# Stable hashes for inode<->key maps (DoS-resistant)
fnv = "1.0"
uuid = { version = "1", features = ["v4"] }
# Errno mapping
errno = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dirs = "5"
# Optional PostgreSQL metadata backend (`meta-server --store postgres://...`).
# Pure-Rust (tokio-postgres under the hood, no libpq needed); TLS features off
# because the backend is reached over a trusted LAN via plain NoTls connections.
# OPTIONAL: the server-side/control-plane subtree only, never the `remote-only`
# client, so tokio is dropped from the Windows build's graph.
postgres = { version = "0.19", default-features = false, optional = true }
# Opt-in per-stage latency telemetry (src/stats.rs): high-dynamic-range histograms
# for offline bottleneck diagnosis. Pure-Rust, zero deps. Only touched when
# `--stats` / `GROVEFS_STATS=1` is on; the disabled path costs one atomic load.
hdrhistogram = "7"
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
# Temp dirs for integration tests (metadata DB, remote data-server backing store)
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
