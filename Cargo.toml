[package]
name = "grovefs"
version = "0.1.0"
edition = "2021"
description = "A user-view FUSE filesystem with pluggable storage backend, no NFS"
license = "MIT"

# The `[[bin]]` is the Linux FUSE mount + cluster server. The native clients
# (see the sibling `grovefs-client` repo: `win/` WinFsp, `mac/` macOS skeleton)
# depend on the `lib` only, with the
# `remote-only` feature, so it never pulls `fuser`/`libc` and builds without a
# FUSE or POSIX-libc dependency. The binary needs the full native stack.
[[bin]]
name = "grovefs"
path = "src/main.rs"
required-features = ["native"]

# P0 ecosystem spike (docs/fdb-keyspace.md is its design reference). An `example`
# rather than a `tests/` integration test or a `src/bin` target because it must
# link `libfdb_c`, drive a live cluster, and use the dev-only executor
# dependencies; `required-features` keeps it out of every normal build so the
# default tree never grows an FDB dependency.
[[example]]
name = "fdb_spike"
path = "examples/fdb_spike.rs"
required-features = ["fdb"]

[lib]
name = "grovefs"
path = "src/lib.rs"

[features]
# Full build: fuse-bridge + on-disk metadata engine (rusqlite) + PostgreSQL
# backend + the cluster servers/control plane. On by default for the Linux
# `grovefs` binary.
default = ["native"]
# The kernel FUSE bridge and real POSIX shims only: `fuser` (kernel bridge),
# `libc` (real errno/ids/signals), plus the `fs_impl` mount path and `bwlimit`
# shaper they need. NO on-disk engine and NO server/control plane. This is what
# a platform-native client links when it serves a REMOTE view through the same
# `GroveFS` code as `grovefs mount` — e.g. the macOS client, combining this with
# `remote-only`: `--no-default-features --features remote-only,fuse-bridge`.
fuse-bridge = ["dep:fuser", "dep:libc"]
# Server-side/on-disk stack: everything in fuse-bridge plus the metadata engines
# and the control plane. Disabled for client builds.
native = ["fuse-bridge", "dep:rusqlite", "dep:postgres"]
# Client transport only: remote MetaProvider + StorageBackend + wire protocol,
# no fuser/libc, no engine. Combine with `--no-default-features` (the Windows
# WinFsp client's build).
remote-only = []
# Optional FoundationDB metadata backend (`meta-server --meta-store fdb://...`).
# OFF by default on purpose: the crate links `libfdb_c` at build time, so turning
# this on requires the FDB client library on the build host. Keeping it off means
# existing build machines (and the `grovefs-win` client, which builds
# `--no-default-features`) never need `libfdb_c` — the FDB store code is not even
# compiled into them. Exactly ONE API-version feature may be on: `fdb-gen`
# defines its `fdb.options` table as a mutually-exclusive `const` per version, so
# enabling `fdb-5_1` next to `fdb-7_1` fails to compile (E0428, `OPTIONS_DATA`
# defined multiple times) — the bindings are built for one API level, and 710 is
# the level the cluster under test runs (7.1.67).
#
# Dependency footprint of this feature, stated exactly once: nothing has to be
# INSTALLED to run it (see `build.rs`: the binary carries an `$ORIGIN`-relative
# RUNPATH plus the client dir it was linked against), and nothing has to be
# installed to BUILD it beyond a C toolchain-less `libfdb_c.so` dropped in some
# directory and named by `FDB_CLIENT_LIB_PATH` (see `.build-bin/fdb_env.sh`). The
# libclang bindgen would otherwise need is avoided by the `[patch.crates-io]` at
# the bottom of this file. `embedded-fdb-include` is a no-op for the vendored
# crate and matters only if that patch is removed — kept so the fallback story
# (`/usr/include/foundationdb` never being required) stays true either way.
fdb = [
    "dep:foundationdb",
    "dep:futures",
    "foundationdb/fdb-7_1",
    "foundationdb/embedded-fdb-include",
]

[dependencies]
# FUSE in userspace. 0.18: high-level Filesystem trait is &self + Send/Sync and
# the session dispatches concurrently across worker threads (Config::n_threads
# with per-worker cloned /dev/fuse fds via FUSE_DEV_IOC_CLONE, Linux). The old
# abi-7-* feature flags are gone; capabilities are negotiated at runtime in
# `init` (KernelConfig::add_capabilities with InitFlags). OPTIONAL: only the
# `fuse-bridge` mount path needs it, so a purely remote client (WinFsp) drops it.
fuser = { version = "0.18", optional = true }
# Embedded metadata engine: view tree + inode mapping. bundled = compile SQLite from source, no system dep. OPTIONAL: only the on-disk `native` engine (src/meta/engine.rs + the meta-server) links it; the `remote-only` client build drops it — and with it the bundled-SQLite C compilation.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# libc for pread/pwrite/fsync (true positional IO, no seek races) and POSIX
# ids/signals. OPTIONAL: the client-only build uses `src/platform.rs` shims
# instead, so this is only pulled in under `fuse-bridge` (or `native`).
libc = { version = "0.2", optional = true }
# CLI
clap = { version = "4", features = ["derive"] }
# Fast in-process locks for the attribute/handle caches
parking_lot = "0.12"
# Stable hashes for inode<->key maps (DoS-resistant)
fnv = "1.0"
uuid = { version = "1", features = ["v4"] }
# Errno mapping
errno = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dirs = "5"
# Optional PostgreSQL metadata backend (`meta-server --store postgres://...`).
# Pure-Rust (tokio-postgres under the hood, no libpq needed); TLS features off
# because the backend is reached over a trusted LAN via plain NoTls connections.
# OPTIONAL: the server-side/control-plane subtree only, never the `remote-only`
# client, so tokio is dropped from the Windows build's graph.
postgres = { version = "0.19", default-features = false, optional = true }
# Opt-in per-stage latency telemetry (src/stats.rs): high-dynamic-range histograms
# for offline bottleneck diagnosis. Pure-Rust, zero deps. Only touched when
# `--stats` / `GROVEFS_STATS=1` is on; the disabled path costs one atomic load.
hdrhistogram = "7"
serde_json = "1.0.154"
sha2 = "0.11.1"
# FoundationDB bindings for the optional FDB metadata backend (feature `fdb`).
# Pure-Rust over the C API; needs `libfdb_c` present to link, hence OPTIONAL and
# off by default. `default-features = false` drops `uuid`/`recipes`: the backend
# stores neither, and the leader-election recipe would import a second
# coordination mechanism next to grovefs's own epoch fencing.
foundationdb = { version = "0.11", default-features = false, optional = true }
# Needed by the FDB store only, and only for `block_on` / `join_all`: the
# bindings are async-only while the crate's metadata surface (`MetaProvider`) is
# synchronous and driven straight from a fuser worker. Deliberately NOT an async
# runtime — an FDB future is a completion callback from the client library's own
# network thread, so parking the calling thread on a waker is sufficient and no
# reactor belongs in this process's dependency graph.
futures = { version = "0.3", optional = true }

[dev-dependencies]
# Temp dirs for integration tests (metadata DB, remote data-server backing store)
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# The last "install a package" dependency of `--features fdb` lived here:
# `foundationdb-sys` is the only bindgen user in this graph and it runs bindgen
# unconditionally, so building the FDB arm needed libclang on the build host.
# There is no upstream escape hatch (checked in 0.8.0 / 0.9.0 / 0.9.1 / 0.10.0, and
# 0.11.0 is the newest published), so this copy is vendored: one build script that
# installs checked-in API-710 bindings, `src/lib.rs` byte-identical to upstream.
# Provenance, the exact delta and the refresh procedure: vendor/foundationdb-sys/VENDOR.md.
#
# Two boundaries worth knowing before changing anything here:
#   * `[patch]` is honoured only for builds whose workspace root is this manifest.
#     A crate that consumes grovefs as a dependency ignores it (cargo warns), which
#     is fine because `fdb` is off by default and the client builds (`remote-only`)
#     never enable it.
#   * the vendored bindings pin API 710; its build script `compile_error!`s on any
#     other version feature rather than linking the wrong symbols.
[patch.crates-io]
foundationdb-sys = { path = "vendor/foundationdb-sys" }
