[package]
name = "grovefs"
version = "0.1.0"
edition = "2021"
description = "A user-view FUSE filesystem with pluggable storage backend, no NFS"
license = "Apache-2.0"

# The `[[bin]]` is the Linux FUSE mount + cluster server. The native clients
# (see the sibling `grovefs-client` repo: `win/` WinFsp, `mac/` macOS skeleton)
# depend on the `lib` only, with the
# `remote-only` feature, so it never pulls `fuser`/`libc` and builds without a
# FUSE or POSIX-libc dependency. The binary needs the full native stack.
[[bin]]
name = "grovefs"
path = "src/main.rs"
required-features = ["native"]

[lib]
name = "grovefs"
path = "src/lib.rs"

[features]
# Full build: fuse-bridge + on-disk metadata engine (rusqlite) + PostgreSQL
# backend + the cluster servers/control plane. On by default for the Linux
# `grovefs` binary.
default = ["native", "web"]
# The kernel FUSE bridge and real POSIX shims only: `fuser` (kernel bridge),
# `libc` (real errno/ids/signals), plus the `fs_impl` mount path and `bwlimit`
# shaper they need. NO on-disk engine and NO server/control plane. This is what
# a platform-native client links when it serves a REMOTE view through the same
# `GroveFS` code as `grovefs mount` — e.g. the macOS client, combining this with
# `remote-only`: `--no-default-features --features remote-only,fuse-bridge`.
fuse-bridge = ["dep:fuser", "dep:libc"]
# Server-side/on-disk stack: everything in fuse-bridge plus the metadata engines
# and the control plane. Disabled for client builds.
native = ["fuse-bridge", "dep:rusqlite", "dep:postgres"]
# Client transport only: remote MetaProvider + StorageBackend + wire protocol,
# no fuser/libc, no engine. Combine with `--no-default-features` (the Windows
# WinFsp client's build).
remote-only = []
# The WEB CONSOLE (`grovefs web`): a static SPA plus the HTTP gateway in front of
# `meta-server --control-listen`. Needs `native` because the account store
# (`web_accounts`) and the governance ops it calls live in the server-side
# stack. Deliberately NOT part of `native`: a client build gains nothing from
# linking an HTTP server, and `remote-only`/WinFsp must stay free of it.
web = ["native", "dep:tiny_http"]
# EXPERIMENTAL metadata engine (`grovefs --meta-store treedb://host:port`):
# single-process epoll event loop, custom binary protocol, own WAL + snapshot
# recovery. OFF by default, and deliberately NOT part of `native`: the whole
# point of the spike is that the default build and the default backend path
# stay byte-identical.
#
# The dependency is a public GIT TAG, not `path = "../treedb"`. That matters
# more than it looks: an optional path dependency is still RESOLVED when the
# feature is off, so a checkout without the sibling clone could not build for
# ANY feature set — which is why this backend stayed on a branch. Pinning a
# tag removes the hazard. Co-developing against a local treedb is a temporary
# `[patch."https://github.com/TechWander/treedb.git"]` block, never a commit.
treedb = ["native", "dep:treedb"]

[dependencies]
# FUSE in userspace. 0.18: high-level Filesystem trait is &self + Send/Sync and
# the session dispatches concurrently across worker threads (Config::n_threads
# with per-worker cloned /dev/fuse fds via FUSE_DEV_IOC_CLONE, Linux). The old
# abi-7-* feature flags are gone; capabilities are negotiated at runtime in
# `init` (KernelConfig::add_capabilities with InitFlags). OPTIONAL: only the
# `fuse-bridge` mount path needs it, so a purely remote client (WinFsp) drops it.
fuser = { version = "0.18", optional = true }
# Embedded metadata engine: view tree + inode mapping. bundled = compile SQLite from source, no system dep. OPTIONAL: only the on-disk `native` engine (src/meta/engine.rs + the meta-server) links it; the `remote-only` client build drops it — and with it the bundled-SQLite C compilation.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# libc for pread/pwrite/fsync (true positional IO, no seek races) and POSIX
# ids/signals. OPTIONAL: the client-only build uses `src/platform.rs` shims
# instead, so this is only pulled in under `fuse-bridge` (or `native`).
libc = { version = "0.2", optional = true }
# CLI
clap = { version = "4", features = ["derive"] }
# Fast in-process locks for the attribute/handle caches
parking_lot = "0.12"
# Stable hashes for inode<->key maps (DoS-resistant)
fnv = "1.0"
uuid = { version = "1", features = ["v4"] }
# Errno mapping
errno = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
dirs = "5"
# Optional PostgreSQL metadata backend (`meta-server --store postgres://...`).
# Pure-Rust (tokio-postgres under the hood, no libpq needed); TLS features off
# because the backend is reached over a trusted LAN via plain NoTls connections.
# OPTIONAL: the server-side/control-plane subtree only, never the `remote-only`
# client, so tokio is dropped from the Windows build's graph.
postgres = { version = "0.19", default-features = false, optional = true }
# Optional metadata-engine backend (feature `treedb`, `--meta-store treedb://...`).
# The engine is a separate database project and is deliberately *not*
# GroveFS-specific: the adapter (op mapping, MetaProvider, GC clues) lives here,
# behind this feature. Pinned to a tag so any checkout resolves it without a
# sibling clone. Anonymous https on purpose: an SSH URL would make `cargo fetch`
# prompt for credentials on machines that only have a key for the private
# remotes. The engine core needs only `libc` + `thiserror` + std, but the pinned
# tag v0.3.0 still carries `postgres`/`rusqlite(bundled)`/`sha2`/`uuid`/
# `chrono`/`tracing` unconditionally for its PG migration shim, and this
# integration uses none of it (only `treedb::net::Client` and
# `treedb::engine::model::Op`). It adds no crate grovefs didn't already resolve,
# but it does widen the reason those crates are here. Upstream moved that shim
# behind an off-by-default `postgres-compat` feature after this pin, so the next
# tag bump shrinks the graph back to the two crates above.
treedb = { git = "https://github.com/TechWander/treedb.git", tag = "v0.3.0", optional = true }
# Opt-in per-stage latency telemetry (src/stats.rs): high-dynamic-range histograms
# for offline bottleneck diagnosis. Pure-Rust, zero deps. Only touched when
# `--stats` / `GROVEFS_STATS=1` is on; the disabled path costs one atomic load.
hdrhistogram = "7"
serde_json = "1.0.154"
sha2 = "0.11.1"
# The web console's HTTP/1.1 server (`grovefs web`, feature `web`). Chosen over
# an async framework because the gateway's whole job is a request/response shim
# in front of an existing TCP control plane: one blocking thread per request, no
# tokio runtime, no async refactor of anything below it, and it inherits the
# workspace's "a client build must not pay for the server's graph" rule.
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
# Temp dirs for integration tests (metadata DB, remote data-server backing store)
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
