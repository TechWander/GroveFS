# Vendored copy of `foundationdb-sys 0.11.0` — see VENDOR.md.
#
# Manifest deltas against the published crate:
#   * `[build-dependencies] bindgen` is gone (that is the whole point: no libclang
#     at build time), and with it the `build.rs` code path that ran it.
#   * packaging metadata (`readme`, `documentation`, `badges`, `docs.rs` features)
#     is dropped — this copy is never published.
# Everything else, including the crate name/version and the feature names the
# `foundationdb` crate forwards to, is unchanged so the patch is a drop-in.
[package]
name = "foundationdb-sys"
version = "0.11.0"
authors = [
    "Benjamin Fry <benjaminfry@me.com>",
    "Vincent Rouillé <vincent@clikengo.com>",
    "Pierre Zemb <contact@pierrezemb.fr>"
]
edition = "2024"
rust-version = "1.85.1"

description = """
Bindings to the C api for FoundationDB
"""

repository = "https://github.com/foundationdb-rs/foundationdb-rs"

keywords = ["foundationdb", "kv"]
categories = ["database"]

license = "MIT/Apache-2.0"

[features]
default = []
# Accepted for compatibility with the upstream feature set. This copy carries no C
# headers — the bindings are already generated — so the flag changes nothing.
embedded-fdb-include = []
fdb-5_1 = []
fdb-5_2 = []
fdb-6_0 = []
fdb-6_1 = []
fdb-6_2 = []
fdb-6_3 = []
fdb-7_0 = []
fdb-7_1 = []
fdb-7_3 = []
fdb-7_4 = []

[dependencies]
libc = "0.2"

[lib]
name = "foundationdb_sys"
path = "src/lib.rs"
